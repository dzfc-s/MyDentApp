name: mydent-210057

services:
  mydent-sqlserver-210057:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mydent-sqlserver-210057
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "${DB_PORT:-1435}:1433"
    expose:
      - "1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mydent-rabbitmq-210057:
    image: rabbitmq:3.13-management
    container_name: mydent-rabbitmq-210057
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Main API — controllers, business logic, publishes appointment-confirmed/cancelled events to
  # RabbitMQ instead of writing notifications itself.
  mydent-api-210057:
    build:
      context: .
      dockerfile: MyDent.WebAPI/Dockerfile
    container_name: mydent-api-210057
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network, services reach each other by service name, not localhost —
      # these two override whatever localhost-based values .env has for host use.
      ConnectionStrings__DefaultConnection: "Server=mydent-sqlserver-210057,1433;Database=210057;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;"
      RabbitMQ__HostName: mydent-rabbitmq-210057
      # Program.cs now gates Swagger/OpenAPI behind IsDevelopment() (was unconditional) — without
      # this, ASP.NET Core defaults to Production when unset, and Swagger becomes unreachable.
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5126:8080"
    depends_on:
      mydent-sqlserver-210057:
        condition: service_healthy
      mydent-rabbitmq-210057:
        condition: service_healthy

  # Separate worker/consumer service (required by the course rubric — a BackgroundService inside
  # the API project does not satisfy this). Consumes appointment-confirmed/cancelled events off
  # RabbitMQ and writes the resulting Notification rows; also runs the appointment/recall
  # reminder poll loop independently of the API.
  mydent-notification-worker-210057:
    build:
      context: .
      dockerfile: MyDent.NotificationWorker/Dockerfile
    container_name: mydent-notification-worker-210057
    restart: unless-stopped
    env_file: .env
    environment:
      ConnectionStrings__DefaultConnection: "Server=mydent-sqlserver-210057,1433;Database=210057;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;"
      RabbitMQ__HostName: mydent-rabbitmq-210057
    depends_on:
      mydent-sqlserver-210057:
        condition: service_healthy
      mydent-rabbitmq-210057:
        condition: service_healthy

volumes:
  sqlserver_data:
  rabbitmq_data:
